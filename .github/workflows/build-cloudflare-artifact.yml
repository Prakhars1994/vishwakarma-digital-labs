name: Build Cloudflare Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://vdl.vliab.workers.dev

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build OpenNext package
        run: npx opennextjs-cloudflare build
      - name: Verify package
        run: |
          test -f .open-next/worker.js
          test -f .open-next/server-functions/default/handler.mjs
          test -d .open-next/assets
          if grep -a -q "/home/runner/work/" .open-next/worker.js; then
            echo "CI-only path detected in Worker entrypoint"
            exit 1
          fi
          if grep -a -q "readFileSync.*home/runner/work\|readFile.*home/runner/work" .open-next/server-functions/default/handler.mjs; then
            echo "CI-only runtime filesystem read detected"
            exit 1
          fi
          echo "Known OpenNext serialized config/trace paths are exempt; runtime entrypoint and filesystem-read checks passed."
          grep -R -F "Family / Dependent Visa" .open-next
          grep -R -F "AED 1,103" .open-next
          grep -R -F "AED 3,864" .open-next
          grep -R -F "AED 6,311" .open-next
          grep -R -F "AED 1,029" .open-next
      - name: Runtime smoke test
        run: |
          (npx wrangler dev --local --port 8787 --config wrangler.jsonc > preview.log 2>&1 & echo $! > preview.pid)
          for i in $(seq 1 30); do
            status=$(curl -sS -L -o homepage.body -w "%{http_code}" http://127.0.0.1:8787/demos/familyvisauae/ || true)
            if [ "$status" != "000" ]; then echo "homepage_status=$status"; break; fi
            sleep 2
          done
          echo "--- preview.log ---"
          cat preview.log
          echo "--- homepage response ---"
          cat homepage.body || true
          for path in /demos/familyvisauae/ /demos/familyvisauae/calculators/family /demos/familyvisauae/services /demos/familyvisauae/fees /demos/familyvisauae/pro-services /demos/familyvisauae/amer-centres-near-me /demos/familyvisauae/contact /demos/familyvisauae/guides /demos/familyvisauae/checklist; do
            status=$(curl -sS -L -o /dev/null -w "%{http_code}" "http://127.0.0.1:8787$path" || true)
            echo "$status $path"
            test "$status" = "200"
          done
          kill $(cat preview.pid) || true
      - name: Archive package
        run: tar -czf opennext-package.tgz .open-next wrangler.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: opennext-package
          path: opennext-package.tgz
          if-no-files-found: error
          retention-days: 1
