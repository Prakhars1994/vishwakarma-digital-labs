name: Build Cloudflare Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://vdl.vliab.workers.dev

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build OpenNext package
        run: npx opennextjs-cloudflare build
      - name: Verify package
        run: |
          test -f .open-next/worker.js
          test -f .open-next/server-functions/default/handler.mjs
          test -d .open-next/assets
          ! grep -R "/home/runner/work/" .open-next
          grep -R -F "Family / Dependent Visa" .open-next
          grep -R -F "AED 1,103" .open-next
          grep -R -F "AED 3,864" .open-next
          grep -R -F "AED 6,311" .open-next
          grep -R -F "AED 1,029" .open-next
      - name: Archive package
        run: tar -czf opennext-package.tgz .open-next wrangler.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: opennext-package
          path: opennext-package.tgz
          if-no-files-found: error
          retention-days: 1
