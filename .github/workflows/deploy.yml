name: VDL Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vdl-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://vdl.vliab.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare credentials available; production deployment enabled."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare credentials are not configured in this repository; build validation passed and deployment is skipped."
          fi

      - name: Build Cloudflare Worker
        if: steps.cloudflare.outputs.available == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Production smoke test
        if: steps.cloudflare.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://vdl.vliab.workers.dev"
          for path in / /work /work/currentpulse-ai /contact /robots.txt /sitemap.xml; do
            echo "Checking ${base}${path}"
            curl --silent --show-error --fail --location --retry 3 --retry-delay 2 --max-time 30 "${base}${path}" >/dev/null
          done
          echo "VDL production smoke test passed."
