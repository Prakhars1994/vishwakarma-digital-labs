name: Ecommerce validation
on:
  push:
    branches: [vdl-ecommerce-marketplace]
  pull_request:
    branches: [main]
jobs:
  validate-ecommerce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ecommerce
      - run: npm run build
  validate-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: standalone-ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  deploy-lumacart:
    if: github.event_name == 'push' && github.ref == 'refs/heads/vdl-ecommerce-marketplace'
    needs: validate-standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: standalone-ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Deploy LUMACART to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
